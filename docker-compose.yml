version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex_password
    ports:
      - "5432:5432"
    volumes:
      - openex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openex-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: openex
      DB_USER: openex
      DB_PASSWORD: openex_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-only-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  openex_pg_data:
